name: "🔧 Something on the list is wrong"
description: A role is in the wrong section, needs experience, is closed, or is missing.
title: "[wrong] "
labels: ["data-correction"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks — this is the most useful kind of issue. Every field on the list
        is produced by a rule, so a wrong value usually means a rule needs
        fixing, which fixes it for every other role too.

        Not sure what a field is supposed to mean? See
        [METHODOLOGY.md](../blob/main/METHODOLOGY.md).

  - type: input
    id: url
    attributes:
      label: The role's Apply link
      description: Paste it straight from the list — that's the role's identity.
      placeholder: https://boards.greenhouse.io/…
    validations:
      required: true

  - type: dropdown
    id: field
    attributes:
      label: Which field is wrong?
      options:
        - Location or distance (it is not near Kissimmee / not open to Florida)
        - It requires experience a beginner does not have
        - It should be listed but is missing (see data/rejected.jsonl)
        - The role is closed but still listed
        - It's a duplicate of another row
        - It isn't an entry-level IT role
        - Job type (internship / part-time / full-time)
        - Posted date
        - Something else
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What should it say?
      placeholder: "The posting requires 3 years of help desk experience."
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Where can I see that?
      description: >
        A quote from the posting, or a screenshot. This is what makes the fix
        checkable instead of a judgement call — and it's how the rule gets a
        regression test.
      placeholder: >
        From the posting: "Minimum of three years in a service desk role is required."
    validations:
      required: true
