name: Diagnose official local IT boards
on:
  push:
    branches: [fix/local-coverage-audit-20261107]
    paths: [.github/local-probe-trigger.txt]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - name: Inspect official government hiring boards
        run: |
          python - <<'PY'
          import urllib.request
          import re
          from html import unescape
          urls = {
            "kissimmee-tyler": "https://cityofkissimmeefl.employeeaccess.tylerapp.com/resident/jobs",
            "kissimmee-munis": "https://cityofkissimmeefl.munisselfservice.com/ess/EmploymentOpportunities/default.aspx",
            "kissimmee-governmentjobs": "https://www.governmentjobs.com/jobs?distance=25&isPromotional=False&isTransfer=False&location=Kissimmee%2C+FL&organization%5B0%5D=City+of+Kissimmee&page=1",
            "tax-collector": "https://www.governmentjobs.com/jobs/5539209-0/it-support-specialist",
          }
          for name,url in urls.items():
              try:
                  request=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0 (compatible; ITSearcher/1.0; job monitor)"})
                  with urllib.request.urlopen(request,timeout=15) as response:
                      content=response.read(600000).decode("utf-8","replace")
                      print("=== SOURCE",name,response.status,"bytes",len(content),"final",response.url)
                      for word in ["IT SPECIALIST","IT Specialist","it-specialist","IT Support Specialist","datePosted","jobPosting","__NEXT_DATA__","__NUXT__"]:
                          matches=list(re.finditer(re.escape(word),content,re.I))
                          print("word",word,"matches",len(matches))
                          for match in matches[:2]:
                              start=max(0,match.start()-220);end=min(len(content),match.end()+450)
                              print("snippet",re.sub(r"\\s+"," ",unescape(content[start:end]))[:650])
                      print("head",re.sub(r"\\s+"," ",content[:650]))
              except Exception as e:
                  print("=== ERROR",name,type(e).__name__,str(e)[:220])
          PY
