name: Restore entry-level IT search
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: intern-engine-writer
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: main
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - name: Apply reviewed entry-level filtering fix
        run: |
          cat > /tmp/entry-search.patch <<'ENTRY_SEARCH_PATCH'
          diff --git a/src/intern_engine/enrich.py b/src/intern_engine/enrich.py
          index 7439872f..96b1446c 100644
          --- a/src/intern_engine/enrich.py
          +++ b/src/intern_engine/enrich.py
          @@ -175,7 +175,7 @@ async def enrich_jobs(jobs: list[Job], existing: dict, net: Net) -> tuple[set[st
                   # A description carried by the current list payload, or fetched now to
                   # backfill old metadata, is fresher evidence than a stored verdict. The
                   # old short-circuit froze changed Lever/Ashby-style postings forever.
          -        job.entry_fit = filters_it.assess_fit(job.title, text)
          +        job.entry_fit = filters_it.assess_fit(job.title, text, job.location)
                   job.entry_fit_version = filters_it.FIT_VERSION
                   job.sponsorship = sponsorship.classify(text)
                   job.skills = skills.extract(text, job.title)
          diff --git a/src/intern_engine/filters_it.py b/src/intern_engine/filters_it.py
          index fc0a1e33..a957f9c1 100644
          --- a/src/intern_engine/filters_it.py
          +++ b/src/intern_engine/filters_it.py
          @@ -42,7 +42,7 @@ def is_opportunity(title: str) -> bool:
                                or re.search(r"\b(?:data cent(?:er|re)|network|noc) technician\b", title, re.I)))
           
           
          -FIT_VERSION = 2
          +FIT_VERSION = 3
           _EXPERIENCE = re.compile(
               r"\b(\d{1,2}|one|two|three|four|five|six|seven|eight|nine|ten)"
               r"\s*(?:\+|(?:-|–|to)\s*\d{1,2})?\s*years?"
          @@ -50,7 +50,7 @@ _EXPERIENCE = re.compile(
           _WORD_NUMBERS = dict(zip('one two three four five six seven eight nine ten'.split(), range(1, 11), strict=True))
           
           
          -def assess_fit(title: str, description: str | None) -> str:
          +def assess_fit(title: str, description: str | None, location: str = "") -> str:
               """Require positive junior evidence; block experienced and unpaid postings.
           
               Unknown descriptions remain unverified, rather than silently claiming fit.
          @@ -63,6 +63,19 @@ def assess_fit(title: str, description: str | None) -> str:
               text = strip_html(description or "")
               if re.search(r"\b(?:unpaid|volunteer|without compensation)\b", title + " " + text, re.I):
                   return "rejected"
          +    # A current undergraduate does not yet meet a completed bachelor's
          +    # requirement. Preserve student/pursuing wording and preferred degrees.
          +    for match in re.finditer(
          +            r"[^.]{0,60}\b(?:bachelor\w*|master\w*)(?:['’]s)?[^.]{0,200}\brequired\b",
          +            text, re.I):
          +        if not re.search(r"\b(?:pursuing|enrolled|student|toward|preferred)\b", match.group(), re.I):
          +            return "rejected"
          +    if location_group(location, title) == "remote":
          +        for match in re.finditer(
          +                r"\b(?:ability to|must|required to|expected to)\s+(?:work|be|report)"
          +                r"[^.]{0,30}\bon[ -]?site\b[^.]{0,100}", text, re.I):
          +            if location_group(match.group()) != "local":
          +                return "rejected"
               for match in _EXPERIENCE.finditer(text):
                   value = match.group(1).lower()
                   years = int(value) if value.isdigit() else _WORD_NUMBERS[value]
          diff --git a/tests/test_filters_it.py b/tests/test_filters_it.py
          index e13b439b..a3ad71b7 100644
          --- a/tests/test_filters_it.py
          +++ b/tests/test_filters_it.py
          @@ -166,3 +166,23 @@ def test_focused_refresh_does_not_mistake_pagination_caps_for_failure():
               assert usable_snapshot_rate(22, 10, {'malformed-response': 10}) < 0.70
               assert usable_snapshot_rate(22, 10, {'pagination-stalled': 10}) < 0.70
               assert usable_snapshot_rate(22, 10, {'result-cap': 11}) < 0.70
          +
          +
          +@pytest.mark.parametrize('text,expected', [
          +    ('Bachelor or Master Degree in a computer-related field or 1-3 years equivalent work experience required.', 'rejected'),
          +    ("Bachelor's degree in IT required.", 'rejected'),
          +    ("Bachelor's degree preferred. No prior experience required.", 'eligible'),
          +    ("Currently pursuing a bachelor's degree required. Paid internship.", 'eligible'),
          +])
          +def test_completed_degree_is_not_the_same_as_current_student(text, expected):
          +    assert filters_it.assess_fit('IT Support Technician', text) == expected
          +
          +
          +def test_remote_label_cannot_override_required_california_attendance():
          +    assert filters_it.assess_fit(
          +        'Technical Support Specialist',
          +        'Required Skills: Ability to work on-site in Milpitas, California.',
          +        'Remote (US), United States') == 'rejected'
          +    assert filters_it.assess_fit(
          +        'Technical Support Specialist', 'Troubleshoot PCs and Windows.',
          +        'Remote (US), United States') == 'eligible'
          ENTRY_SEARCH_PATCH
          if git apply --check /tmp/entry-search.patch; then
            git apply /tmp/entry-search.patch
          elif git apply --reverse --check /tmp/entry-search.patch; then
            echo 'Filtering fix already applied; refreshing results.'
          else
            echo '::error::Source changed; patch requires review.'
            exit 1
          fi
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Verify the repaired engine
        run: |
          python -m pytest -q
          ruff check src tests tools run.py
          node --test tests/test_saved_roles.cjs
      - name: Refresh local employers and known entry-level sources
        env:
          WORKDAY_PROXY: ${{ secrets.WORKDAY_PROXY }}
        run: |
          python - <<'PYTHON'
          import sys
          sys.path.insert(0, 'src')
          import run
          from intern_engine import pipeline, registry, store, paths, filters_it
          # First refresh is focused for quick verification. The hourly update
          # continues scanning the complete unchanged employer registry.
          companies = registry.load()
          records = store.load(paths.JOBS_PATH)
          keys = {(r['source'], r['company_slug']) for r in records.values()
                  if filters_it.is_opportunity(r['title'])
                  and filters_it.location_group(r['location'], r['title'])}
          nearby = {'University of Central Florida', 'The Walt Disney Company',
                    'NBCUniversal', 'Leidos', 'Marriott Vacations Worldwide',
                    'Hilton Worldwide'}
          focused = [c for c in companies
                     if (c['ats'], c['slug']) in keys or c['name'] in nearby]
          assert focused, 'No source boards selected'
          print(f'Focused live check: {len(focused)} employer boards', flush=True)
          pipeline._load_companies = lambda: focused
          run.cmd_update()
          PYTHON
      - name: Verify published artifacts
        run: python tools/verify_accuracy.py
      - name: Save repaired search and results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add run.py src tests tools data/config.json README.md data docs
          if git diff --staged --quiet; then exit 0; fi
          git commit -m 'Fix entry-level IT search, verify requirements, and refresh relevant employers'
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            if [ "$(git rev-parse origin/main)" = "$(git rev-parse HEAD)" ]; then exit 0; fi
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep $((attempt * 5))
          done
