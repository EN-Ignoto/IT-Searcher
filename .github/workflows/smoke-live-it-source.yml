name: Verify live IT job source

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/jobicy-smoke-request.txt"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
      - name: Install production dependencies
        run: pip install -r requirements.txt
      - name: Check Himalayas entry-level IT availability
        run: |
          python - <<'PY'
          import httpx
          import sys

          sys.path.insert(0, "src")
          from intern_engine import filters_it

          queries = ("help desk", "IT support", "desktop support", "network technician", "IT technician")
          count = 0
          with httpx.Client(timeout=20, follow_redirects=True) as client:
              for query in queries:
                  response = client.get("https://himalayas.app/jobs/api/search", params={
                      "q": query, "country": "US", "sort": "recent", "page": 1,
                  })
                  response.raise_for_status()
                  data = response.json()
                  jobs = data.get("jobs", [])
                  if query == "help desk" and jobs:
                      import json
                      sample = jobs[0]
                      keys = ("guid", "applicationLink", "expiryDate", "pubDate", "seniority", "locationRestrictions", "employmentType", "title")
                      print("Himalayas sample fields:", json.dumps({key: sample.get(key) for key in keys}), flush=True)
                  relevant = [j for j in jobs if filters_it.is_opportunity(j.get("title", ""))]
                  count += len(relevant)
                  print(f"Himalayas {query}: {len(jobs)} candidates, {len(relevant)} first-job titles", flush=True)
                  for job in relevant[:5]:
                      print(" -", job.get("title"), "|", job.get("companyName"), "|", job.get("guid"), flush=True)
          print(f"Himalayas relevant candidate titles: {count}", flush=True)
          PY
      - name: Verify official Kissimmee job board and qualification filters
        run: |
          python - <<'PY'
          import asyncio
          import sys

          import httpx

          sys.path.insert(0, "src")
          from intern_engine import filters_it, models
          from intern_engine.connectors import governmentjobs
          from intern_engine.net import HostLimiter, Net

          async def main():
              async with httpx.AsyncClient(timeout=httpx.Timeout(20.0, connect=10.0),
                                           follow_redirects=True) as session:
                  result = await governmentjobs.fetch(
                      {"name": "City of Kissimmee Public Jobs",
                       "slug": "kissimmee-city", "ats": "governmentjobs"},
                      Net(session, HostLimiter()),
                  )
              if result.incomplete_reason == models.INCOMPLETE_MALFORMED:
                  raise SystemExit("City of Kissimmee job board could not be parsed.")
              from intern_engine.connectors import governmentjobs as gov
              import re
              async with httpx.AsyncClient(timeout=20, follow_redirects=True) as session:
                  net = Net(session, HostLimiter())
                  page = await net.get_text(gov._CITY_URL + "1", retries=1)
                  links = gov.city_links(page)
                  print("Live city listing: job-item-container", page.count("job-item-container"),
                        "job-details-link", page.count("job-details-link"),
                        "parsed IT links", len(links), flush=True)
                  for item, title in links.items():
                      detail = await net.get_text("https://www.governmentjobs.com" + item, retries=1)
                      print("City detail", title, "JSON-LD scripts", len(gov._SCRIPT.findall(detail)),
                            "parse success", gov.city_job(item, detail) is not None,
                            "datePosted", "datePosted" in detail, flush=True)
                  print("Search title mentions", len(re.findall("IT Specialist", page, re.I)), flush=True)
              print(f"City of Kissimmee: {len(result.jobs)} relevant IT-title candidates", flush=True)
              for job in result.jobs:
                  verdict = filters_it.assess_fit(job.title, job.description, job.location)
                  print(job.title, "|", job.posted_at, "|", verdict, "|", job.url, flush=True)
                  if "it specialist" in job.title.casefold():
                      # No mandatory 2+ years may silently pass as entry-level.
                      assert verdict == "rejected", "2-year IT Specialist misclassified"
          asyncio.run(main())
          PY
      - name: Fetch live US remote IT support posts
        run: |
          python - <<'PY'
          import asyncio
          import json
          import sys
          import httpx

          sys.path.insert(0, "src")
          from intern_engine import filters_it
          from intern_engine.connectors import jobicy
          from intern_engine.net import HostLimiter, Net

          async def main():
              async with httpx.AsyncClient(
                  timeout=httpx.Timeout(20.0, connect=10.0),
                  follow_redirects=True,
              ) as session:
                  source = {"name": "Jobicy US Remote IT Jobs",
                            "slug": "us-remote-it", "ats": "jobicy"}
                  result = await jobicy.fetch(source, Net(session, HostLimiter()))
              matched = [j for j in result.jobs
                         if filters_it.bucket(j.title, j.location)]
              verdicts = {}
              for j in matched:
                  verdict = filters_it.assess_fit(j.title, j.description, j.location)
                  verdicts[verdict] = verdicts.get(verdict, 0) + 1
              print("Jobicy live result:",
                    json.dumps({
                        "parsed_us_roles": len(result.jobs),
                        "first_job_titles": len(matched),
                        "requirement_verdicts": verdicts,
                        "complete_lifecycle_snapshot": result.complete,
                        "incomplete_reason": result.incomplete_reason,
                    }, sort_keys=True), flush=True)
              for job in matched[:12]:
                  print(job.title, "|", job.company, "|", job.url, flush=True)
              if not result.jobs:
                  raise SystemExit("No parsable US jobs returned. Check API access or filters.")
          asyncio.run(main())
          PY
