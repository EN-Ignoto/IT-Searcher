name: Update IT opportunities

on:
  push:
    branches: [main]
    # Push a refresh request file to start a real full scan immediately,
    # without depending on GitHub's delayed scheduled-event delivery.
    paths:
      - ".github/refresh-request.txt"
  schedule:
    # Repeat hourly, away from the busiest top-of-hour slot.
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      render_only:
        description: Rebuild the published tracker from saved data without a fresh collection
        type: boolean
        default: false
      allow_feed_collapse:
        description: Allow a manual refresh to publish a sharp drop in open jobs
        type: boolean
        default: false

permissions:
  contents: write             # needed so the bot can commit the refreshed data

concurrency:
  group: intern-engine-writer
  cancel-in-progress: false

jobs:
  update:
    # Pinned for REPRODUCIBILITY, not as an outage fix: `ubuntu-latest` already
    # resolves to 24.04 today, so this is the same pool — it just stops the
    # image moving under us when GitHub advances the alias. The 2026-08-06
    # runner-allocation failures (zero steps, blank runner_name, "not acquired
    # by a Runner of type hosted") were a platform incident that no repo-side
    # setting prevents; recovery is handled by retry.yml instead.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: main

      - name: Refresh queued checkout
        run: |
          git fetch --no-tags origin main
          git checkout --detach origin/main
          echo "BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the engine
        env:
          # Optional: WORKDAY_PROXY lets the cloud runner reach Workday tenants
          # that block datacenter IPs. Unset = Workday runs direct.
          WORKDAY_PROXY: ${{ secrets.WORKDAY_PROXY }}
        run: python run.py ${{ inputs.render_only && 'render' || 'update' }}

      # The gate between "we produced output" and "the world sees it". Checks
      # every open role against the accuracy invariants AND the run as a whole
      # (volume floor, fetch collapse). If this fails the job stops here with
      # the previous good build still live on Pages.
      - name: Verify accuracy before publishing
        env:
          MIN_OPEN_ROLES: "0"
          MAX_STATS_AGE_HOURS: "2"
          ALLOW_STALE_STATS: ${{ inputs.render_only && '1' || '0' }}
        run: python tools/verify_accuracy.py

      # Keep the last published feed when filters unexpectedly remove almost
      # all jobs. Manual overrides should follow confirmation of genuine closures.
      - name: Prevent unexpected feed collapse
        if: ${{ !inputs.render_only }}
        env:
          ALLOW_FEED_COLLAPSE: ${{ inputs.allow_feed_collapse && '1' || '0' }}
        run: python tools/check_feed_collapse.py

      # Alerts are sent by a LATER step, on purpose: an alert promises the role
      # is on the list, so nothing goes out until this push actually lands.
      - name: Commit & push if changed
        id: publish
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md data/jobs.json data/internships.csv data/stats.json \
                  data/health.json data/history.jsonl data/rejected_titles.jsonl \
                  data/observed.json data/known_windows.json data/outbox.json \
                  docs/index.html docs/feed.xml docs/unsubscribe.html \
                  docs/confirm.html \
                  docs/internships.csv \
                  docs/radar.ics docs/trends-light.svg docs/trends-dark.svg \
                  docs/api/jobs.json docs/api/stats.json docs/api/radar.json
          if git diff --staged --quiet; then
            echo "No changes."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore: update internships ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          git fetch --no-tags origin main
          if [ "$(git rev-parse origin/main)" != "$BASE_SHA" ]; then
            echo "::error::main changed after generation; refusing to rebase stale artifacts"
            exit 1
          fi
          # Retry transient GitHub 5xx failures without repeating the collection.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              break
            fi
            # A lost response may follow a successful push.
            git fetch --no-tags origin main
            if [ "$(git rev-parse origin/main)" = "$(git rev-parse HEAD)" ]; then
              break
            fi
            if [ "$(git rev-parse origin/main)" != "$BASE_SHA" ]; then
              echo "::error::main advanced; refusing to overwrite newer changes"
              exit 1
            fi
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep $((attempt * 5))
          done
