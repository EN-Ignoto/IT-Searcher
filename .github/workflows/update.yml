name: Update jobs

on:
  schedule:
    # Off-peak minutes: GitHub drops scheduled runs at :00 and :30 most often.
    - cron: "7,37 * * * *"    # local sources, every 30 minutes
    - cron: "52 */6 * * *"    # nationwide sweep (remote roles), every 6 hours
  workflow_dispatch:
    inputs:
      scope:
        description: "local = Central Florida sources only; full = also the nationwide registry"
        type: choice
        options: [local, full]
        default: local

permissions:
  contents: write             # the bot commits the refreshed data
  actions: read

# One writer at a time, across both schedules: two runs committing the same
# data files would race, and the loser's push is refused.
concurrency:
  group: it-searcher-writer-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 170
    env:
      BRANCH: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.ref_name }}

      - name: Refresh queued checkout
        run: |
          git fetch --no-tags origin "$BRANCH"
          git checkout --detach "origin/$BRANCH"
          echo "BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Choose scope
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}
          REQUESTED: ${{ inputs.scope }}
        run: |
          if [ "$EVENT" = "schedule" ] && [ "$CRON" = "52 */6 * * *" ]; then
            echo "flag=--full" >> "$GITHUB_OUTPUT"
          elif [ "$REQUESTED" = "full" ]; then
            echo "flag=--full" >> "$GITHUB_OUTPUT"
          else
            echo "flag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Run the engine
        env:
          # Optional: lets the runner reach Workday tenants that block
          # datacenter IPs. Unset = Workday is read directly.
          WORKDAY_PROXY: ${{ secrets.WORKDAY_PROXY }}
          FLAG: ${{ steps.scope.outputs.flag }}
        run: python run.py update $FLAG

      # The gate between "we produced output" and "the site shows it". If it
      # fails, the job stops here and the previous good build stays live.
      - name: Verify before publishing
        env:
          MAX_STATS_AGE_HOURS: "2"
        run: python tools/verify_accuracy.py

      - name: Commit & push if changed
        id: publish
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md data/jobs.json data/jobs.csv data/stats.json \
                  data/health.json data/history.jsonl data/rejected.jsonl \
                  data/assessed.json data/unmatched_titles.json docs/index.html docs/feed.xml docs/jobs.csv \
                  docs/api/jobs.json docs/api/stats.json
          if git diff --staged --quiet; then
            echo "No changes."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore: update jobs ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          git fetch --no-tags origin "$BRANCH"
          if [ "$(git rev-parse "origin/$BRANCH")" != "$BASE_SHA" ]; then
            echo "::error::$BRANCH changed after generation; refusing to push stale artifacts"
            exit 1
          fi
          git push origin "HEAD:$BRANCH"
          OWNER="$(echo "${GITHUB_REPOSITORY%%/*}" | tr '[:upper:]' '[:lower:]')"
          {
            echo "pushed=true"
            echo "rendered_at=$(python -c 'import json; print(json.load(open("data/stats.json"))["rendered_at"])')"
            echo "pages_url=https://${OWNER}.github.io/${GITHUB_REPOSITORY#*/}"
          } >> "$GITHUB_OUTPUT"

      # A push is not yet a public page. The published stats carry this run's
      # exact `rendered_at`; seeing it at the live URL proves the site updated.
      # Only the default branch is served by Pages.
      - name: Wait for Pages to serve this build
        if: steps.publish.outputs.pushed == 'true' && github.ref_name == github.event.repository.default_branch
        timeout-minutes: 13
        env:
          PAGES_URL: ${{ steps.publish.outputs.pages_url }}
          RENDERED_AT: ${{ steps.publish.outputs.rendered_at }}
        run: |
          set -uo pipefail
          deadline=$(( $(date +%s) + 600 ))
          while [ "$(date +%s)" -lt "$deadline" ]; do
            live="$(curl -fsSL --max-time 20 \
              "$PAGES_URL/api/stats.json?cb=$(date +%s)" \
              | python -c 'import json,sys; print(json.load(sys.stdin).get("rendered_at",""))' \
              2>/dev/null || true)"
            if [ "$live" = "$RENDERED_AT" ]; then
              echo "Pages is serving this build (rendered_at=$RENDERED_AT)."
              exit 0
            fi
            sleep 10
          done
          echo "::warning::Pages is still serving an older build after 10 minutes"
